services:

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    expose:
      - "9100"
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    expose:
      - "9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    expose:
      - "9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    # เข้าใช้งานผ่าน nginx: http://localhost/grafana/
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # ให้ Grafana ทำงานใต้ path /grafana/ หลัง reverse proxy
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    # SMTP (Gmail) + ALERT_EMAIL_TO for the alert contact point
    env_file:
      - .env
    depends_on:
      - prometheus
      - line-notifier
    restart: unless-stopped

  # Grafana webhook -> LINE Messaging API (push)
  line-notifier:
    build: ./line-notifier
    image: ${DOCKER_USER:-local}/line-notifier:latest
    container_name: line-notifier
    env_file:
      - .env
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

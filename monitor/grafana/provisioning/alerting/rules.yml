# Alert when the Express API is down (blackbox probe of http://express:4000/api/health fails)
apiVersion: 1

groups:
  - orgId: 1
    name: shopdee-availability
    folder: Shopdee
    interval: 10s
    rules:
      - uid: express-down
        title: Express API down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job="blackbox", service="express"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }   # probe_success < 1 => down
        for: 30s                 # must fail for 30s before alerting (avoid flapping)
        noDataState: Alerting    # no data (e.g. blackbox/prometheus lost the target) => treat as down
        execErrState: Error
        labels:
          severity: critical
          service: express
        annotations:
          summary: Express API (http://express:4000/api/health) ไม่ตอบสนอง
          description: blackbox-exporter ตรวจ /api/health ไม่ผ่าน (API หรือ MySQL อาจล่ม)

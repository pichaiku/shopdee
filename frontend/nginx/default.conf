server {

    listen 80;
    server_name _;

    ####################################
    # Next.js
    ####################################
    location / {

        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }


    ####################################
    # Express API
    ####################################
    location /api/node/ {
        proxy_pass http://express:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ####################################
    # Grafana (monitor) -> http://localhost/grafana/
    ####################################
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        # resolve at request time so nginx still starts when the monitor stack is down
        resolver 127.0.0.11 valid=10s;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;   # keep the /grafana/ prefix (GF_SERVER_SERVE_FROM_SUB_PATH=true)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live (websocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    ####################################
    # Flask API
    ####################################
    location /api/flask/ {
        proxy_pass http://flask:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
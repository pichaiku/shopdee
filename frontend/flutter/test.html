<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <style>

@import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
* {
  -webkit-font-smoothing: antialiased;
  box-sizing: border-box;
}
html,
body {
  margin: 0px;
  height: 100%;
}
/* a blue color as a generic focus style */
button:focus-visible {
  outline: 2px solid #4a90e2 !important;
  outline: -webkit-focus-ring-color auto 5px !important;
}
a {
  text-decoration: none;
}        

.box {
  width: 320px;
  height: 46px;
}

.box .rectangle {
  position: fixed;
  width: 322px;
  height: 48px;
  top: 0;
  left: 0;
  border-radius: 10px;
  border: 1px solid;
  border-color: #2f80ed;
}

    </style>
  </head>
  <body>
    <div class="box" data-model-id="125:178-frame"><input type="text"  class="rectangle"></input></div>
  </body>
</html>
